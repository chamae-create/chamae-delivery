workflows:
  ios-unsigned:
    name: Chamae - primeira compilacao iOS (sem assinatura)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      flutter: 3.47.5
      xcode: latest
      cocoapods: default
    # Checkout is performed by Codemagic. Start this workflow manually.
    # No signing, secrets, publishing or automatic triggers in this workflow.
    scripts:
      - name: Flutter dependencies
        script: flutter pub get --enforce-lockfile
      - name: Static analysis
        script: flutter analyze --no-pub
      - name: Focused Firebase configuration tests
        script: flutter test --no-pub test/production_firebase_configuration_test.dart
      - name: Validate native configuration
        script: |
          set -euo pipefail
          plutil -lint ios/Runner/Info.plist ios/Runner/GoogleService-Info.plist ios/Flutter/AppFrameworkInfo.plist ios/Runner.xcodeproj/project.pbxproj
          ruby -c ios/Podfile
      - name: Compile iOS without signing
        script: flutter build ios --debug --no-codesign --no-pub
    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
      - ios/Podfile.lock

  ios-beta-build: &ios_beta_client
    name: Chamae client - STAGING IPA (manual, sem upload)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: chamae_app_store_connect
    environment:
      flutter: 3.47.5
      xcode: latest
      cocoapods: default
      groups:
        - chamae_beta_ios_client
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.loumak.chamae.staging
      vars:
        BETA_APP_ROLE: client
        BETA_BUILD_NUMBER: "3"
        APP_STORE_APPLE_ID: "6833594439"
        BETA_BUNDLE_ID: br.com.loumak.chamae.staging
    # No push/PR triggers. Start only after the owner authorizes this build.
    scripts:
      - name: Select unused TestFlight build number (read only)
        script: |
          set -euo pipefail
          set +x
          test "$APP_STORE_APPLE_ID" = "6833594439"
          latest="$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --platform IOS --all-versions)"
          BETA_BUILD_NUMBER="$(python3 tool/beta/prepare_ios_beta.py --select-build-number "$latest")"
          export BETA_BUILD_NUMBER
          printf 'BETA_BUILD_NUMBER=%s\n' "$BETA_BUILD_NUMBER" >> "$CM_ENV"
          printf 'Selected iOS build number: %s\n' "$BETA_BUILD_NUMBER"
      - name: Validate STAGING native configuration and unique build number
        script: python3 tool/beta/prepare_ios_beta.py
      - name: Resolve locked Flutter dependencies
        script: flutter pub get --enforce-lockfile
      - name: Analyze active code (warnings and errors remain fatal)
        script: flutter analyze --no-pub --no-fatal-infos lib
      - name: Prepare CocoaPods
        script: |
          set -euo pipefail
          flutter build ios --config-only --release --no-codesign --no-pub -t lib/main_staging.dart --build-name=1.0.0 --build-number="$BETA_BUILD_NUMBER" --dart-define-from-file=.beta-build/ios-defines.json
          python3 tool/beta/prepare_ios_beta.py --verify-generated
          cd ios
          pod install
      - name: Configure authorized App Store signing profiles
        script: xcode-project use-profiles
      - name: Build signed beta IPA
        script: |
          set -euo pipefail
          flutter build ipa --release --no-pub -t lib/main_staging.dart --build-name=1.0.0 --build-number="$BETA_BUILD_NUMBER" --dart-define-from-file=.beta-build/ios-defines.json --export-options-plist="$HOME/export_options.plist"
          python3 tool/beta/prepare_ios_beta.py --verify-ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - ios/Podfile.lock

  ios-beta-upload-existing:
    name: Chamae client - upload existing IPA only (manual)
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: chamae_app_store_connect
    environment:
      xcode: latest
      groups:
        - chamae_beta_ios_client_upload
      vars:
        SOURCE_CODEMAGIC_BUILD_ID: 6af5f44a9679c85ac0af2ce2
        EXPECTED_IPA_SHA256: 94ab3d6b864316339b2c4518b80c94f767f06e10277ec3b7399919c2947fcf6f
        EXPECTED_BUNDLE_ID: br.com.loumak.chamae.staging
        EXPECTED_APP_STORE_APPLE_ID: "6833594439"
    # No automatic triggers. Running this workflow authorizes an Apple upload.
    scripts:
      - name: Download private artifact and validate existing signed IPA
        script: |
          set -euo pipefail
          set +x
          umask 077
          python3 tool/beta/download_existing_ipa.py
    artifacts:
      - .private-upload/chamae_delivery.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
