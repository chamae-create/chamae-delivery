name: chamae_delivery
description: "Chamaê Delivery - Bebidas e Conveniência na Fronteira Brasil/Paraguai"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  google_fonts: ^6.2.1
  video_player: ^2.9.2
  geolocator: ^14.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  google_maps_flutter: ^2.18.2
  geocoding: ^5.0.0
  cloud_functions: ^6.5.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/splash_bg.png
    - assets/images/pitstop_promo.mp4
    - assets/images/home/
    - assets/images/splash/
